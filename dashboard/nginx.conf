server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The dashboard talks only to analytics-api, same-origin via this proxy
    # (no CORS). Docker's resolver lets nginx start even if the API is not up
    # yet; requests then return 502 and the UI shows "cannot reach the API".
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://analytics-api:8082;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
